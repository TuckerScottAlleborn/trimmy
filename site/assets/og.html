<!doctype html>
<!--
  The link-preview card (og:image). make.py renders it at 1200x630 into ../public/og.png.
  X shows only this picture (no title text), so the name and tagline live in the image. Keep it
  readable at a third of the size, and keep the ghost and name near the middle: some apps crop
  previews to a square.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trimmy link preview card</title>
<style>
  @font-face { font-family: JBM; font-weight: 400; font-display: block; src: url(../public/fonts/jetbrains-mono-400.woff2) format("woff2") }
  @font-face { font-family: JBM; font-weight: 800; font-display: block; src: url(../public/fonts/jetbrains-mono-800.woff2) format("woff2") }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0d0e }
  body { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: JBM, monospace; color: #e9f5ea }
  .frame { position: absolute; inset: 24px; border: 2px dashed #243029 }
  .url { position: absolute; top: 44px; left: 52px; font-size: 24px; color: #74847a }
  .ghost { display: block; width: 162px; height: 150px }
  h1 { margin: 18px 0 0; font-size: 148px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: #53fc18; text-shadow: 0 0 44px rgb(83 252 24 / 0.35) }
  p { margin: 22px 0 0; font-size: 42px; line-height: 1.2 }
  p span { color: #74847a }
  .timeline { display: block; margin-top: 40px; overflow: visible }
</style>
</head>
<body>
<div class="frame"></div>
<div class="url">trimmy.lol</div>
<svg class="ghost" viewBox="-0.4 0 10.8 10" shape-rendering="crispEdges"><defs><path id="g" d="M3 0h4v1h2v1h1v8H9V9H8v1H6V9H4v1H2V9H1v1H0V2h1V1h2z"/></defs><use href="#g" x="-0.35" fill="#ff2bd6"/><use href="#g" x="0.35" fill="#00e5ff"/><use href="#g" fill="#53fc18"/><path fill="#fff" d="M2 3h2v1H3v1H2zm4 0h2v1H7v1H6z"/><path fill="#041000" d="M3 4h1v1H3zm4 0h1v1H7z"/></svg>
<h1>trimmy</h1>
<p><span>#</span> a comically simple video trimmer</p>
<svg class="timeline" id="timeline" width="840" height="72" viewBox="0 0 840 72"></svg>
<script>
  // A waveform like the app's timeline, with the clip between two handles. Seeded, so every
  // render comes out the same.
  const W = 840, H = 72, BARS = 120, STEP = W / BARS, IN = 0.24 * W, OUT = 0.74 * W
  let seed = 11
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  let svg = `<rect x="${IN}" width="${OUT - IN}" height="${H}" fill="rgb(83 252 24 / 0.14)"/>`
  for (let i = 0; i < BARS; i++) {
    const x = i * STEP + 1.5, t = i / BARS
    const loud = 0.35 + 0.65 * Math.exp(-(((t - 0.5) / 0.14) ** 2)) // the action is mid-clip
    const h = Math.max(4, Math.round(H * loud * (0.35 + 0.65 * random())))
    const inside = x >= IN && x + 4 <= OUT
    svg += `<rect x="${x}" y="${(H - h) / 2}" width="4" height="${h}" fill="${inside ? '#53fc18' : '#2c5a1c'}"/>`
  }
  for (const x of [IN, OUT]) {
    svg += `<rect x="${x - 3}" y="-6" width="6" height="${H + 12}" fill="#53fc18" style="filter: drop-shadow(0 0 8px rgb(83 252 24 / 0.8))"/>`
  }
  document.getElementById('timeline').innerHTML = svg
</script>
</body>
</html>
