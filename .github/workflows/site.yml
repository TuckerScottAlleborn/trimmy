# Builds site/ and publishes it to GitHub Pages at https://trimmy.lol (see site/README.md).
# The page shows the latest release, so publishing or deleting a release rebuilds it too.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  release:
    types: [published, unpublished, deleted]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on the release's tag, and the github-pages environment only takes
  # deployments from main. So a release just starts this workflow again on main.
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No setup-node or npm install: the build has no dependencies, and the runner's Node will do.
      - run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
