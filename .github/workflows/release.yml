# Builds the Windows installers and attaches them to a GitHub Release.
# To release: bump the version (package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml),
# then push a tag like v0.1.0. The release is created as a draft; publish it on GitHub.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Also runs scripts/fetch-ffmpeg.mjs (the "pretauri" hook), which downloads the pinned,
      # checksum-verified FFmpeg that gets bundled.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Trimmy ${{ github.ref_name }}
          releaseBody: |
            **Download `Trimmy_*_x64-setup.exe`** and run it. No admin rights and nothing else to install.
            (`Trimmy_*_x64_en-US.msi` is there too, for IT / Group Policy installs.)

            Windows may show "Windows protected your PC" because the installer isn't code-signed yet:
            click **More info** then **Run anyway**.
          releaseDraft: true
          prerelease: false

      # Manual runs (no tag) still get downloadable installers from the run's summary page.
      - uses: actions/upload-artifact@v4
        with:
          name: trimmy-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
