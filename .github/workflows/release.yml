# Builds the installers and attaches them to a GitHub Release:
#   Windows: NSIS setup.exe + MSI      macOS (untested): universal .dmg (Apple Silicon + Intel)
# To release: bump the version (package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml),
# add its section to CHANGELOG.md, then push a tag like v1.0.0. The release is created as a
# draft whose notes are that CHANGELOG section plus the install steps below; publish it on GitHub.
# Every action is pinned to a full commit SHA (tag in the comment): the release jobs hold the
# update signing key, so a moved tag must not be able to change what runs here.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  RELEASE_BODY: |
    ## Install

    ### Windows
    **Download `Trimmy_*_x64-setup.exe`** and run it. No admin rights and nothing else to install.
    (`Trimmy_*_x64_en-US.msi` is there too, for IT / Group Policy installs.)

    Windows may show "Windows protected your PC" because the installer isn't code-signed yet:
    click **More info** then **Run anyway**.

    ### macOS (untested)
    `Trimmy_*_universal.dmg` runs on Apple Silicon and Intel Macs (macOS 11+). **It is built
    automatically but has never been tried on a real Mac**, so please report what happens.
    It isn't notarized: after dragging Trimmy to Applications, open it once from
    **System Settings → Privacy & Security → Open Anyway**, or run
    `xattr -dr com.apple.quarantine /Applications/Trimmy.app`.

jobs:
  windows:
    runs-on: windows-latest
    # The signing key lives in this environment, which only v* tags and main may use.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Downloads the pinned, checksum-verified FFmpeg that gets bundled (also run by "pretauri").
      - run: node scripts/fetch-ffmpeg.mjs

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # The notes: this version's CHANGELOG.md section, then the install steps (RELEASE_BODY).
      - name: Release notes
        shell: bash
        run: |
          version="${TAG#v}"
          # Windows runners check files out with CRLF line endings, hence the \r strip.
          notes=$(awk -v heading="## $version" '{sub(/\r$/, "")} /^## /{on = ($0 == heading); next} on' CHANGELOG.md)
          if [ -n "$TAG" ] && [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          {
            echo 'RELEASE_NOTES<<END_OF_NOTES'
            printf '%s\n\n%s\n' "$notes" "$RELEASE_BODY"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies can trust them (see README: Releasing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Trimmy ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          # Also build the signed update files and latest.json (kept out of local builds, which
          # have no signing key). Windows updates use the per-user setup.exe, not the MSI.
          args: --config src-tauri/tauri.updater.conf.json
          updaterJsonPreferNsis: true

      # Manual runs (no tag) still get downloadable installers from the run's summary page.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trimmy-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    # After Windows, so both jobs add to the same draft release instead of racing to create it.
    needs: windows
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fetches both CPU builds of FFmpeg and joins them into universal binaries with lipo.
      - run: node scripts/fetch-ffmpeg.mjs

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # The notes: this version's CHANGELOG.md section, then the install steps (RELEASE_BODY).
      - name: Release notes
        shell: bash
        run: |
          version="${TAG#v}"
          # Windows runners check files out with CRLF line endings, hence the \r strip.
          notes=$(awk -v heading="## $version" '{sub(/\r$/, "")} /^## /{on = ($0 == heading); next} on' CHANGELOG.md)
          if [ -n "$TAG" ] && [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          {
            echo 'RELEASE_NOTES<<END_OF_NOTES'
            printf '%s\n\n%s\n' "$notes" "$RELEASE_BODY"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies can trust them (see README: Releasing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Trimmy ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          args: --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json

      # The closest thing to testing we can do without a Mac in hand: the app bundle exists, holds
      # both CPU architectures, and its bundled FFmpeg actually runs.
      - name: Smoke-test the app bundle
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Trimmy.app
          ls -la "$app/Contents/MacOS" "$app/Contents/Resources/licenses"
          lipo -info "$app/Contents/MacOS/trimmy"
          lipo -info "$app/Contents/MacOS/ffmpeg"
          "$app/Contents/MacOS/ffmpeg" -hide_banner -version | head -n 1
          "$app/Contents/MacOS/ffprobe" -hide_banner -version | head -n 1
          codesign -dv "$app" 2>&1 | head -n 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trimmy-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
