[package]
name = "trimmy"
version = "1.0.0"
description = "A video trimmer. That's it."
license = "MIT"
repository = "https://github.com/TuckerScottAlleborn/trimmy"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

# The app mostly waits on FFmpeg, so build for size: a smaller exe that loads faster.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
