[package]
name = "trimmy"
version = "0.1.0"
description = "Comically simple video trimmer"
license = "MIT"
repository = "https://github.com/TuckerScottAlleborn/trimmy"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
